html{scroll-behavior:smooth;}
body{font-family:var(--i);color:var(--text);background:var(--cream);}
img{display:block;max-width:100%;}

nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:rgba(27,45,74,0.95);backdrop-filter:blur(10px);}

.nav-logo img{height:40px;width:40px;object-fit:contain;filter:invert(1) brightness(2);}
.nav-logo-text{font-family:var(--r);font-size:19px;font-weight:800;letter-spacing:5px;color:white;text-transform:uppercase;}
.nav-links{display:flex;align-items:center;gap:28px;}
.nav-link{font-family:var(--r);font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.6);transition:color .2s;}

.nav-cta{font-family:var(--r);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:var(--coral);color:white;padding:9px 20px;border-radius:2px;}

.breadcrumb{padding:88px 6vw 0;background:var(--cream);}
.bc-inner{display:flex;align-items:center;gap:8px;font-family:var(--r);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:16px 0;}
.bc-inner a{color:var(--muted);transition:color .2s;}
.bc-inner a:hover{color:var(--navy);}
.bc-sep{color:#bbb;}

.product-page{
  display:grid;

  min-height:80vh;

/* GALLERY */
.gallery-col{position:sticky;top:80px;align-self:start;}
.main-photo{
  aspect-ratio:1/1;
  background:#e4eef8;
  border-radius:6px;
  overflow:hidden;
  margin-bottom:10px;
  cursor:zoom-in;
}
.main-photo img{
  width:100%;height:100%;
  object-fit:contain;
  padding:32px;
  transition:opacity .2s;
}
.thumbs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.thumb{
  aspect-ratio:1/1;
  border-radius:4px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
  background:#dde8f4;
  transition:border-color .2s;
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb.active{border-color:var(--navy);}
.thumb:hover:not(.active){border-color:var(--coral);}

/* LIGHTBOX */
.lightbox{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.88);
  align-items:center;justify-content:center;
}
.lightbox.open{display:flex;}

.lb-close{position:fixed;top:20px;right:28px;font-size:32px;color:white;cursor:pointer;line-height:1;opacity:.7;}
.lb-close:hover{opacity:1;}

.lb-prev:hover,.lb-next:hover{opacity:1;}

.lb-next{right:16px;}

.detail-type{

.spec-val{font-family:var(--r);font-size:12px;font-weight:800;color:var(--navy);}

.size-btn:hover,.size-btn.sel{background:var(--navy);border-color:var(--navy);color:white;}
.size-btn.unica{cursor:default;background:var(--navy);border-color:var(--navy);color:white;}

.btn-back{

  .detail-name{font-size:clamp(36px,10vw,52px);}
  .specs{grid-template-columns:1fr;}

    <span class="bc-sep">›</span>
    <span id="bc-name"></span>
  </div>
</div>

<div class="product-page" id="product-page">
  <!-- filled by JS -->
</div>

<div class="lightbox" id="lightbox">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <span class="lb-prev" onclick="lbMove(-1)">&#8592;</span>
  <img class="lb-img" id="lb-img" src="" alt="">
  <span class="lb-next" onclick="lbMove(1)">&#8594;</span>
</div>

<footer class="footer-simple">
  <p class="footer-copy">© 2026 Flamingo Sports · Santiago, Chile · <a href="devoluciones.html" style="color:inherit;text-decoration:underline;opacity:.6;">Cambios y devoluciones</a></p>
</footer>

<script>
const params  = new URLSearchParams(window.location.search);
const id      = params.get('id') || '';
const prod    = CATALOGO[id];
const page    = document.getElementById('product-page');

if (!prod) {
  page.innerHTML = `
    <div class="not-found">
      <strong>Producto no encontrado</strong>
      <a href="productos.html" style="color:var(--coral);font-family:var(--r);font-weight:700;letter-spacing:1px;">← Ver catálogo completo</a>
    </div>`;
} else {
  document.title = `${prod.nombre} ${prod.color} — ${prod.tipo} para Tenis y Pádel | Flamingo Sports`;
  document.getElementById('page-title').textContent = document.title;
  document.getElementById('page-desc').setAttribute('content', `${prod.tipo} Flamingo Sports ${prod.color}. Talla única 36–44 unisex. Amortiguación, compresión en arco y ventilación activa para tenis y pádel. Disponible en MercadoLibre Chile.`);
  document.getElementById('page-canonical').setAttribute('href', `https://www.flamingosports.cl/producto.html?id=${id}`);
  document.getElementById('og-title').setAttribute('content', `${prod.nombre} ${prod.color} — ${prod.tipo} Flamingo Sports`);
  document.getElementById('og-desc').setAttribute('content', `${prod.tipo} para tenis y pádel. Talla única 36–44 unisex. Amortiguación, compresión y ventilación activa. Envío a todo Chile.`);
  document.getElementById('og-image').setAttribute('content', `https://www.flamingosports.cl/${prod.fotos[0]}`);
  document.getElementById('og-url').setAttribute('content', `https://www.flamingosports.cl/producto.html?id=${id}`);
  document.getElementById('tw-title').setAttribute('content', `${prod.nombre} ${prod.color} — ${prod.tipo} Flamingo Sports`);
  document.getElementById('tw-desc').setAttribute('content', `${prod.tipo} para tenis y pádel. Talla única 36–44 unisex. Amortiguación, compresión y ventilación activa.`);
  document.getElementById('tw-image').setAttribute('content', `https://www.flamingosports.cl/${prod.fotos[0]}`);

  // Product JSON-LD Schema
  const _schema = {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": `${prod.nombre} ${prod.color} — ${prod.tipo} Flamingo Sports`,
    "description": prod.descripcion,
    "image": prod.fotos.map(f => `https://www.flamingosports.cl/${f}`),
    "sku": id,
    "brand": {"@type": "Brand", "name": "Flamingo Sports"},
    "category": "Calcetines deportivos para tenis y pádel",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "CLP",
      "price": "9990",
      "availability": "https://schema.org/InStock",
      "url": `https://www.flamingosports.cl/producto.html?id=${id}`,
      "seller": {"@type": "Organization", "name": "Flamingo Sports"}
    }
  };
  const _el = document.createElement('script');
  _el.type = 'application/ld+json';
  _el.textContent = JSON.stringify(_schema);
  document.head.appendChild(_el);

  document.getElementById('bc-name').textContent = `${prod.nombre} ${prod.color}`;

  page.innerHTML = `
    <div class="gallery-col">
      <div class="main-photo" onclick="openLightbox(currentPhoto)">
        <img id="main-img" src="${prod.fotos[0]}" alt="${prod.nombre} ${prod.color}">
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="info-col">
      <span class="detail-type">${prod.tipo}</span>
      <h1 class="detail-name">${prod.nombre}</h1>
      <p class="detail-color">${prod.color}</p>
      <div class="divider"></div>
      <p class="detail-desc">${prod.descripcion}</p>
      <div class="specs">
        <div class="spec"><div class="spec-label">Tipo</div><div class="spec-val">${prod.tipo}</div></div>
        <div class="spec"><div class="spec-label">Material</div><div class="spec-val">${prod.material}</div></div>
        <div class="spec"><div class="spec-label">Uso</div><div class="spec-val">Tenis · Pádel</div></div>
        <div class="spec"><div class="spec-label">Origen</div><div class="spec-val">Chile</div></div>
      </div>
      <div class="size-section">
        <div class="size-title">Talla</div>
        <div class="size-opts" id="size-opts">
          ${prod.tallas.length === 1
            ? `<button class="size-btn unica" disabled>${prod.tallas[0]}</button>`
            : prod.tallas.map((t,i) => `<button class="size-btn${i===0?' sel':''}" onclick="selSize(this)">${t}</button>`).join('')
          }
        </div>
      </div>
      <button class="btn-add-cart" onclick="Cart.add({ id: '${id}', name: '${prod.nombre} ${prod.color}', type: '${prod.tipo}', image: '${prod.fotos[0]}', price: 9990 })">Agregar al carrito</button>
      <button id="btn-buy" class="btn-buy" onclick="initMPCheckout()">Comprar ahora — $9.990</button>
      <p class="mp-loading" id="mp-loading">Abriendo pago seguro…</p>
<a href="productos.html" class="btn-back">← Ver todos los productos</a>
    </div>`;

  // Gallery
  let currentPhoto = 0;
  const mainImg = document.getElementById('main-img');
  const thumbsEl = document.getElementById('thumbs');

  function setPhoto(idx) {
    currentPhoto = idx;
    mainImg.style.opacity = '0';
    setTimeout(() => {
      mainImg.src = prod.fotos[idx];
      mainImg.alt = `${prod.nombre} ${prod.color} — vista ${idx + 1}`;
      mainImg.style.opacity = '1';
    }, 150);
    thumbsEl.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
  }

  thumbsEl.innerHTML = prod.fotos.map((f, i) =>
    `<div class="thumb${i===0?' active':''}" onclick="setPhoto(${i})"><img src="${f}" alt="Vista ${i+1}" loading="lazy"></div>`
  ).join('');

  // Lightbox
  window.openLightbox = function(idx) {
    currentPhoto = idx;
    document.getElementById('lb-img').src = prod.fotos[idx];
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeLightbox = function() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  };
  window.lbMove = function(dir) {
    const next = (currentPhoto + dir + prod.fotos.length) % prod.fotos.length;
    setPhoto(next);
    document.getElementById('lb-img').src = prod.fotos[next];
  };
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  window.setPhoto = setPhoto;
  window.selSize = function(btn) {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
  };
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') lbMove(1);
  if (e.key === 'ArrowLeft')  lbMove(-1);
});

// ── Mercado Pago Checkout Pro ──
window.initMPCheckout = async function() {
  const btn = document.getElementById('btn-buy');
  const loading = document.getElementById('mp-loading');
  const params = new URLSearchParams(window.location.search);
  const prodId = params.get('id') || 'calcetines';
  const prodData = CATALOGO[prodId];

  btn.disabled = true;
  btn.textContent = 'Preparando pago…';
  loading.style.display = 'block';

  try {
    const res = await fetch('https://mp-preference.flamingosport-cl.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: [{
          id: prodId,
          name: prodData ? `${prodData.nombre} ${prodData.color}` : 'Calcetines Flamingo Sports',
          type: prodData ? prodData.tipo : 'Calcetín',
          image: prodData ? prodData.fotos[0] : '',
          price: 9990,
          qty: 1,
        }]
      }),
    });

    const data = await res.json();
    if (!data.init_point) throw new Error('Sin init_point');

    window.location.href = data.init_point;

  } catch (err) {
    console.error('MP error:', err);
    alert('Hubo un problema al abrir el pago. Inténtalo de nuevo o contáctanos por WhatsApp.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Comprar — $9.990';
    loading.style.display = 'none';
  }
};
</script>
